<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SUMAT - Auditoría Tributaria</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; background:#f4f6f7; }
  .card { background:#fff; padding:30px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
  h1 { color:#2c3e50; font-size:22px; }
  label { display:block; margin-top:14px; font-weight:bold; color:#333; }
  input { width:100%; padding:8px; margin-top:4px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px; }
  button { margin-top:22px; padding:10px 20px; background:#2c3e50; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  button:hover { background:#1a252f; }
  .flash { background:#fdecea; color:#c0392b; padding:10px; border-radius:4px; margin-bottom:10px; }
  a { color:#2c3e50; }
</style>
</head>
<body>
<div class="card">
  <h1>Auditoría de Ingresos Declarados vs. Reales</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}

  <form action="{{ url_for('auditar') }}" method="post">
    <label>RIF</label>
    <input type="text" name="rif" required placeholder="J-12345678-9">

    <label>Razón Social</label>
    <input type="text" name="razon_social" required>

    <label>Dirección</label>
    <input type="text" name="direccion">

    <label>Período (ej. 2026-08)</label>
    <input type="text" name="periodo" required>

    <label>Ingresos Declarados</label>
    <input type="number" step="0.01" name="ingresos_declarados" required>

    <label>Ingresos Reales (auditados)</label>
    <input type="number" step="0.01" name="ingresos_reales" required>

    <button type="submit">Generar Acta de Reparo Fiscal (PDF)</button>
  </form>
  <p style="margin-top:20px;"><a href="{{ url_for('historial') }}">Ver historial de declaraciones</a></p>
</div>
</body>
</html>
